map $uri $asset_cache {
  default "no-store";
  ~*\.(?:js|css)$ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;
  client_max_body_size 3m;
  location /api/ { proxy_pass $backend_upstream; proxy_set_header Host $host; proxy_set_header X-Agenda-Client-IP $remote_addr; }
  location /admin/ { proxy_pass $backend_upstream; proxy_set_header Host $host; proxy_set_header X-Agenda-Client-IP $remote_addr; }
  location /health/ { proxy_pass $backend_upstream; }
  location /ready/ { proxy_pass $backend_upstream; }
  add_header Cache-Control $asset_cache always;
  location ~* \.(?:js|css)$ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
